name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance (OIDC) — publish fails if unavailable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # 1. Identity: the pushed tag must match the version being published.
      - name: Verify tag matches package version
        run: npm run verify:tag

      # 2. Full validation (lint, typechecks, tests, dual build, smoke imports,
      #    package contents) before anything leaves the runner.
      - name: Validate
        run: npm run validate

      # 3. A tag is not publishable until it passes against the pinned 0.4.0
      #    server fixture. This is in the publish job so it cannot race a
      #    separate CI workflow.
      - name: Start pinned Streamline fixture
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run required conformance suite
        env:
          STREAMLINE_CONFORMANCE_REQUIRE: "1"
        run: npm run test:conformance

      - name: Stop Streamline fixture
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      # 4. SBOM is fail-closed: no `|| true`, pinned generator version.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom.cdx.json --output-format json

      - name: Verify SBOM is usable
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('sbom.cdx.json', 'utf8');
            if (raw.trim().length === 0) { console.error('SBOM is empty'); process.exit(1); }
            const sbom = JSON.parse(raw);
            if (sbom.bomFormat !== 'CycloneDX') { console.error('SBOM is not CycloneDX'); process.exit(1); }
            const count = Array.isArray(sbom.components) ? sbom.components.length : 0;
            if (count === 0) { console.error('SBOM has no components'); process.exit(1); }
            console.log('SBOM OK: ' + count + ' components (' + sbom.specVersion + ')');
          "

      # 5. Publish with provenance. Requires id-token: write; the publish fails
      #    (rather than silently publishing unattested) if attestation fails.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 6. Only after a successful publish, cut the GitHub release with the SBOM.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            sbom.cdx.json
